body.pfs .cfg{display:none}
.chips,.mini{display:flex;align-items:center;gap:1vmin;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.1);border-radius:99px;padding:.6vmin 1.6vmin;font-weight:700;font-size:inherit}
.chip.sel{background:var(--acc);color:var(--acc-tx)}
.st{display:flex;align-items:center;gap:.6vmin;margin-left:1vmin}
.st span{color:var(--mut);margin-right:.4vmin}
.st .val{width:4.2em;padding:.35em .2em;border:0;border-radius:.6em;background:rgba(255,255,255,.1);color:inherit;font:inherit;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text;outline:0}
.st .val.n{width:2.8em}
.st .val:focus{background:rgba(255,255,255,.2);box-shadow:0 0 0 2px var(--acc)}
@media (pointer:coarse){.st .val{font-size:16px}}
.st button{width:2.6em;height:2.6em;border-radius:50%;background:rgba(255,255,255,.12);font-weight:800}
.st button:active{background:var(--acc);color:var(--acc-tx)}
.info{display:flex;justify-content:center;align-items:center;gap:3vmin;padding-top:2vmin}
#phase{font-size:clamp(24px,7vmin,96px);font-weight:900;letter-spacing:.08em}
#cyc{font-size:clamp(18px,5vmin,64px);font-weight:800;background:rgba(0,0,0,.25);padding:.3vmin 2.4vmin;border-radius:99px}
.time{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font-size:min(34vw,62vh);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:2vmin;background:rgba(0,0,0,.28);margin:0 3vmin}
.bar i{display:block;height:100%;width:0;background:#fff}
.btns{display:flex;gap:2vmin;justify-content:center;padding:2vmin}
.btns button{background:rgba(0,0,0,.32);border-radius:1.6vmin;padding:1.4vmin 3vmin;font-size:clamp(16px,3.4vmin,40px);font-weight:800}
.btns .main{background:#fff;color:#111;min-width:24vmin}

/* modo randori */
.cfg{grid-area:cfg}.info{grid-area:info}.time{grid-area:time}.bar{grid-area:bar}.btns{grid-area:btns}
.pane{display:none;flex-direction:column;gap:1vmin;margin:1.5vmin;padding:1.5vmin;border-radius:2vmin;min-height:0;transition:opacity .2s,box-shadow .2s;--pb:rgba(255,255,255,.2);--ipb:#fff;--ipt:#1d4ed8}
#p-blue{grid-area:pb;background:#1d4ed8;color:#fff}
#p-white{grid-area:pw;background:#f4f4f5;color:#18181b;--pb:rgba(0,0,0,.1);--ipb:#18181b;--ipt:#fff}
.pane.win{box-shadow:0 0 0 .9vmin #facc15}
.pane.lose{opacity:.55}
.pane.off .pn-btns{opacity:.4}
.pn-head{display:flex;justify-content:space-between;align-items:center;gap:1vmin}
.pn-name{font-weight:900;letter-spacing:.08em;font-size:clamp(14px,3.4vmin,40px)}
.cards{display:flex;gap:.6vmin}
.cards i{display:block;width:clamp(10px,2vmin,26px);height:clamp(15px,3vmin,38px);border-radius:.4vmin;border:.3vmin solid currentColor;opacity:.35}
.cards i.on{background:#facc15;border-color:#a16207;opacity:1}
.pn-score{display:flex;justify-content:space-around;text-align:center}
.pn-score b{display:block;font-size:clamp(28px,9vmin,110px);line-height:1;font-variant-numeric:tabular-nums}
.pn-score small{font-size:clamp(9px,1.6vmin,18px);font-weight:700;opacity:.8;letter-spacing:.06em}
.pn-btns{flex:1;min-height:0;display:flex;flex-direction:column;gap:1vmin}
.pn-btns .row{display:flex;gap:1vmin;flex:1;min-height:0}
.sc,.mn{border-radius:1.4vmin;background:var(--pb);color:inherit;font-weight:900;min-height:0}
.sc{flex:1;font-size:clamp(12px,3vmin,34px);letter-spacing:.04em}
.sc.ip{flex:1.3;background:var(--ipb);color:var(--ipt)}
.sc.sh{background:#facc15;color:#111}
.pn-btns .row>.half{display:flex;gap:1vmin;flex:1;min-width:0}
.sc{min-width:0;overflow:hidden}
.sc.os{font-size:clamp(10px,2.4vmin,28px);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.sc.os small{font-size:.75em;font-weight:700;opacity:.9}
.sc.os.on{background:#f97316;color:#111}
.mn{width:22%;max-width:9vmin;min-width:36px;font-size:clamp(16px,3.4vmin,36px)}
.pane button:active{filter:brightness(.8)}
.pane button:disabled{pointer-events:none}
#app.rando{display:grid;grid-template-columns:1fr minmax(0,1.5fr) 1fr;grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"cfg cfg cfg" "pb info pw" "pb time pw" "pb bar pw" "pb btns pw"}
#app.rando .pane{display:flex}
#app.rando .chips,#app.rando .st,#app.rando #skip{display:none}
#app.rando .cfg,#app.rando .mini{justify-content:center}
#app.rando .info{flex-wrap:wrap;gap:1vmin 2vmin;text-align:center}
#app.rando #phase{font-size:clamp(16px,4.6vmin,64px)}
#app.rando #cyc{font-size:clamp(11px,2.6vmin,28px)}
#cyc:empty{display:none}
#app.rando .time{font-size:min(13vw,40vh)}
#app.rando .btns .main{flex:1;font-size:clamp(22px,6.5vmin,70px);padding:2.4vmin 3vmin;letter-spacing:.1em}
.btns .main.mate{color:#dc2626}
.btns button.arm{background:#dc2626;color:#fff}
@media (orientation:portrait){
  #app.rando{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto minmax(0,1fr) auto auto;grid-template-areas:"cfg cfg" "info info" "time time" "pb pw" "bar bar" "btns btns"}
  #app.rando .time{font-size:min(24vw,15vh)}
}
</style>
</head>

<script>
const PRESETS=[{n:"4’/1’ ×5",f:240,r:60,c:5},{n:"3’/1’ ×5",f:180,r:60,c:5},{n:"2’/10” ×12",f:120,r:10,c:12},{n:"10’/0 ×1",f:600,r:0,c:1}];
let cfg={fight:240,rest:60,cycles:5};
const $=id=>document.getElementById(id);
const fmt2=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
let osae={side:null,level:0},osaeT=0,osaeAt=0,over=false,rando=false,winner=null,endHow="",endFrom="fight",lastEnd=null,saved=null,sc=newSc(),prepOn=false,mode="idle",phase="fight",cycle=1,remaining=cfg.fight,total=cfg.fight,endAt=0,raf=0,lastSec=null,wl;

function newSc(){return{blue:{i:0,w:0,y:0,s:0},white:{i:0,w:0,y:0,s:0}}}
const SIDE={blue:"AZUL",white:"BLANCO"};
const fmtUp=s=>{s=Math.floor(Math.max(0,s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

/* sonidos */
let ac;
function tone(f,t0,d,type="sine",v=.45){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.setValueAtTime(v,t+d-.08);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sndTick=()=>tone(880,0,.12);
const sndFight=(d=0)=>{tone(880,d,.18);tone(1320,d+.24,.4)};
const sndRest=(d=0)=>{tone(523,d,.3);tone(392,d+.36,.45)};
const sndEnd=()=>tone(330,0,1.1,"sawtooth",.35);
const sndFinal=()=>{[0,1.3,2.6].forEach(t=>tone(330,t,1,"sawtooth",.35))};

/* ajustes */
function renderCfg(){
  $("v-fight").value=fmt2(cfg.fight);$("v-rest").value=fmt2(cfg.rest);$("v-cycles").value=cfg.cycles;
  [...$("presets").children].forEach((b,i)=>{const p=PRESETS[i];b.classList.toggle("sel",p.f===cfg.fight&&p.r===cfg.rest&&p.c===cfg.cycles)});
}
function resetIdle(){cancelAnimationFrame(raf);osae={side:null,level:0};osaeT=0;over=false;sc=newSc();winner=null;lastEnd=null;mode="idle";phase="fight";cycle=1;total=remaining=cfg.fight;lastSec=null;renderCfg();paint()}
PRESETS.forEach(p=>{const b=document.createElement("button");b.className="chip";b.textContent=p.n;b.onclick=()=>{cfg={fight:p.f,rest:p.r,cycles:p.c};resetIdle()};$("presets").appendChild(b)});
document.querySelectorAll(".st button").forEach(b=>b.onclick=()=>{
  const k=b.dataset.k,d=+b.dataset.d,min=k==="cycles"?1:(k==="rest"?0:1),max=k==="cycles"?99:3600;
  cfg[k]=Math.min(max,Math.max(min,cfg[k]+d));resetIdle()});

$("prepbtn").onclick=()=>{prepOn=!prepOn;$("prepbtn").textContent="Preparación: "+(prepOn?"SÍ":"NO");$("prepbtn").classList.toggle("sel",prepOn)};

/* modo randori */
const canScore=()=>rando&&(mode==="run"||mode==="pause")&&(phase==="fight"||phase==="golden");
function pointsLeader(){
  const b=sc.blue,w=sc.white;
  if(b.w!==w.w)return b.w>w.w?"blue":"white";
  if(b.y!==w.y)return b.y>w.y?"blue":"white";
  return null;
}
function leader(){
  const l=pointsLeader();if(l)return l;
  const b=sc.blue,w=sc.white;
  if(b.s!==w.s)return b.s<w.s?"blue":"white";
  return null;
}
function finish(win,how,undo){
  osae={side:null,level:0};osaeT=0;over=false;
  endHow=how;lastEnd=undo?{...undo,from:phase}:null;
  endFrom=phase;winner=win;
  mode="end";phase="end";cancelAnimationFrame(raf);
  if(!undo)remaining=0;
  sndFinal();paint();
}
function score(side,t){
  if(!canScore())return;
  const me=sc[side],other=side==="blue"?"white":"blue",u={side,t};
  if(t==="i"){me.i=1;finish(side,"IPPON",u);return}
  me[t]++;
  if(t==="s"){if(me.s>=3)finish(other,"HANSOKU-MAKE",u);else paint();return}
  if(phase==="golden"){finish(side,"GOLDEN SCORE",u);return}
  if(t==="w"&&me.w>=2){finish(side,"2 WAZA-ARI",u);return}
  paint();
}
function dec(side,t){if(canScore()&&sc[side][t]>0){sc[side][t]--;paint()}}
const sndOsae=()=>tone(1200,0,.2);
function osaeStep(){
  const sd=osae.side,me=sc[sd];
  if(osaeT>=5&&osae.level<1){
    osae.level=1;me.y++;sndOsae();
    if(phase==="golden"){finish(sd,"GOLDEN SCORE",{side:sd,t:"y"});return}
    if(over&&pointsLeader()===sd){finish(sd,"PUNTOS",{side:sd,t:"y"});return}
  }
  if(osaeT>=10&&osae.level<2){
    osae.level=2;let back;if(me.y>0){me.y--;back="y"}
    me.w++;sndOsae();
    if(phase==="golden"){finish(sd,"GOLDEN SCORE",{side:sd,t:"w",back});return}
    if(me.w>=2){finish(sd,"2 WAZA-ARI",{side:sd,t:"w",back});return}
    if(over&&pointsLeader()===sd){finish(sd,"PUNTOS",{side:sd,t:"w",back});return}
  }
  if(osaeT>=20&&osae.level<3){
    osae.level=3;let back;if(me.w>0){me.w--;back="w"}
    me.i=1;finish(sd,"IPPON",{side:sd,t:"i",back});
  }
}
function endOsae(){
  osae={side:null,level:0};osaeT=0;
  if(over){over=false;remaining=0;next()}else paint();
}
function osaeBtn(side){
  if(osae.side===side){endOsae();return}
  if(!osae.side&&canScore()&&mode==="run"){osae={side,level:0};osaeT=0;osaeAt=performance.now();paint()}
}
["blue","white"].forEach(side=>{
  const p=document.createElement("section");
  p.className="pane";p.id="p-"+side;
  const row=(t,l,m)=>'<div class="row"><button class="sc'+(t==="s"?" sh":"")+'" data-s="'+side+'" data-t="'+t+'">'+l+'</button><button class="mn" data-s="'+side+'" data-t="'+t+'" aria-label="Quitar '+l.toLowerCase()+'">−</button></div>';
  const shrow='<div class="row"><div class="half"><button class="sc sh" data-s="'+side+'" data-t="s">SHIDO</button><button class="mn" data-s="'+side+'" data-t="s" aria-label="Quitar shido">−</button></div><button class="sc os" data-s="'+side+'" data-t="o">OSAE-KOMI</button></div>';
  p.innerHTML='<div class="pn-head"><span class="pn-name">'+SIDE[side]+'</span><span class="cards" id="c-'+side+'"></span></div>'
   +'<div class="pn-score"><div><b id="w-'+side+'">0</b><small>WAZA-ARI</small></div><div><b id="y-'+side+'">0</b><small>YUKO</small></div></div>'
   +'<div class="pn-btns"><button class="sc ip" data-s="'+side+'" data-t="i">IPPON</button>'+row("w","WAZA-ARI")+row("y","YUKO")+shrow+'</div>';
  $("app").appendChild(p);
});
document.querySelectorAll(".pane button").forEach(b=>b.onclick=()=>{
  if(b.classList.contains("mn"))dec(b.dataset.s,b.dataset.t);else if(b.dataset.t==="o")osaeBtn(b.dataset.s);else score(b.dataset.s,b.dataset.t);
});
$("undo").onclick=()=>{
  if(!lastEnd)return;
  const e=lastEnd;lastEnd=null;
  if(e.t==="i")sc[e.side].i=0;else sc[e.side][e.t]--;
  if(e.back)sc[e.side][e.back]++;
  winner=null;phase=e.from;mode="pause";paint();
};
$("randobtn").onclick=()=>{
  if(mode==="run"||mode==="pause")return;
  rando=!rando;
  if(rando){saved={...cfg};cfg={fight:240,rest:0,cycles:1}}else if(saved){cfg=saved}
  $("randobtn").textContent="Randori: "+(rando?"SÍ":"NO");
  $("randobtn").classList.toggle("sel",rando);
  resetIdle();
};

/* escribir los valores con el teclado */
function parseTime(str){
  str=str.trim().replace(/[’‘´`]/g,"'");
  let m=str.match(/^(\d*)\s*[':;,.]\s*(\d*)$/);
  if(m&&(m[1]||m[2]))return (+m[1]||0)*60+(+m[2]||0);
  if(/^\d+$/.test(str))return +str*60;
  return null;
}
document.querySelectorAll(".val").forEach(inp=>{
  const k=inp.dataset.k;
  inp.addEventListener("focus",()=>setTimeout(()=>inp.select(),0));
  inp.addEventListener("change",()=>{
    let v=k==="cycles"?(/^\d+$/.test(inp.value.trim())?+inp.value.trim():null):parseTime(inp.value);
    if(v===null){renderCfg();return}
    const min=k==="cycles"?1:(k==="rest"?0:1),max=k==="cycles"?99:3600;
    cfg[k]=Math.min(max,Math.max(min,v));resetIdle();
  });
});

/* cronómetro */
function paint(){
  let cls=mode==="idle"?"idle":phase==="end"?"end":phase==="fight"?"fight":phase==="prep"||phase==="wait"?"prep":phase==="golden"?"golden":"rest";
  if(mode==="run"&&phase==="fight"&&remaining<=10&&total>15)cls="warn";
  $("app").className=cls+(rando?" rando":"");
  $("cfg").classList.toggle("locked",mode==="run"||mode==="pause");
  document.querySelectorAll(".val").forEach(i=>i.disabled=mode==="run"||mode==="pause");
  $("phase").textContent=phaseText();
  $("cyc").textContent=cycText();
  $("time").textContent=timeText();
  $("prog").style.width=phase==="end"||phase==="golden"?"100%":mode==="idle"?"0%":(100*(1-remaining/total))+"%";
  $("toggle").textContent=toggleText();
  $("toggle").classList.toggle("mate",rando&&mode==="run");
  $("undo").hidden=!(rando&&mode==="end"&&lastEnd);
  if(rando)paintRando();
}
function phaseText(){
  if(mode==="idle")return "LISTO";
  if(rando){
    if(phase==="end")return "GANA "+SIDE[winner]+" · "+endHow;
    if(phase==="prep")return "PREPARADOS";
    if(phase==="wait")return "EMPATE";
    if(osae.side&&mode!=="pause")return "OSAE-KOMI "+SIDE[osae.side];
    return mode==="pause"?"MATE":phase==="golden"?"GOLDEN SCORE":"COMBATE";
  }
  return phase==="fight"?"COMBATE":phase==="prep"?"PREPARADOS":phase==="rest"?"PAUSA":"FIN";
}
function cycText(){
  if(rando)return over?"FIN DEL TIEMPO":phase==="wait"||(phase==="golden"&&mode==="pause")?"GOLDEN SCORE":"";
  return phase==="end"?"✓":cycle+" / "+cfg.cycles;
}
function timeText(){
  if(phase==="end")return rando?(endFrom==="golden"?fmtUp(remaining):fmt(remaining)):"0:00";
  return phase==="golden"?fmtUp(remaining):fmt(remaining);
}
function toggleText(){
  if(rando)return mode==="run"?"MATE":mode==="end"?"OTRA VEZ":"HAJIME";
  return mode==="run"?"⏸ PAUSA":mode==="pause"?"▶ SEGUIR":mode==="end"?"▶ OTRA VEZ":"▶ COMENZAR";
}
function paintRando(){
  const can=canScore();
  ["blue","white"].forEach(side=>{
    const s=sc[side],p=$("p-"+side),c=$("c-"+side),n=s.s;
    $("w-"+side).textContent=s.w;$("y-"+side).textContent=s.y;
    if(c.dataset.n!==String(n)){c.dataset.n=n;c.innerHTML=Array.from({length:Math.max(3,n)},(_,i)=>'<i class="'+(i<n?"on":"")+'"></i>').join("")}
    p.querySelectorAll("button").forEach(b=>b.disabled=!can);
    const ob=p.querySelector(".os"),act=osae.side===side;
    const h=act?"SORE-MADE<small>"+Math.floor(osaeT)+" s</small>":"OSAE-KOMI";
    if(ob.dataset.h!==h){ob.dataset.h=h;ob.innerHTML=h}
    ob.classList.toggle("on",act);
    ob.disabled=!(can&&(act||(mode==="run"&&!osae.side)));
    p.classList.toggle("off",!can&&mode!=="end");
    p.classList.toggle("win",mode==="end"&&winner===side);
    p.classList.toggle("lose",mode==="end"&&!!winner&&winner!==side);
  });
}
function setPhase(p){over=false;phase=p;total=remaining=p==="fight"?cfg.fight:p==="prep"?5:p==="wait"?10:p==="golden"?0:cfg.rest;lastSec=null;endAt=performance.now()+remaining*1000}
function next(){
  if(phase==="prep"){setPhase("fight");sndFight();paint();return}
  if(rando){
    if(phase==="fight"){const w=leader();if(w){finish(w,sc.blue.w!==sc.white.w||sc.blue.y!==sc.white.y?"PUNTOS":"MENOS SHIDOS",null);return}sndEnd();setPhase("wait");paint();return}
    if(phase==="wait"){setPhase("golden");sndFight();paint();return}
    return;
  }
  if(phase==="fight"&&cycle>=cfg.cycles){mode="end";phase="end";remaining=0;cancelAnimationFrame(raf);sndFinal();paint();return}
  sndEnd();
  if(phase==="fight"){
    if(cfg.rest>0){setPhase("rest");sndRest(1.3)}else{cycle++;setPhase("fight");sndFight(1.3)}
  }else{cycle++;setPhase("fight");sndFight(1.3)}
  paint();
}
function tick(){
  if(mode!=="run")return;
  const now=performance.now();
  if(osae.side){osaeT=(now-osaeAt)/1000;osaeStep();if(mode!=="run")return}
  if(phase==="golden"){remaining=(now-endAt)/1000;paint();raf=requestAnimationFrame(tick);return}
  if(over){remaining=0;paint();raf=requestAnimationFrame(tick);return}
  remaining=(endAt-now)/1000;
  const s=Math.ceil(remaining);
  if(s!==lastSec){lastSec=s;if(s>0&&s<=3)sndTick()}
  if(remaining<=0){
    if(osae.side){over=true;remaining=0;paint()}
    else{next();if(mode!=="run")return}
  }else paint();
  raf=requestAnimationFrame(tick);
}
async function lock(){try{wl=await navigator.wakeLock.request("screen")}catch(e){}}
function start(){if(rando){sc=newSc();winner=null;lastEnd=null}cycle=1;mode="run";setPhase(prepOn?"prep":"fight");prepOn?sndTick():sndFight();lock();paint();raf=requestAnimationFrame(tick)}
function toggle(){
  if(mode==="idle"||mode==="end")start();
  else if(mode==="run"){mode="pause";cancelAnimationFrame(raf);paint()}
  else{mode="run";endAt=phase==="golden"?performance.now()-remaining*1000:performance.now()+remaining*1000;if(osae.side)osaeAt=performance.now()-osaeT*1000;lock();paint();raf=requestAnimationFrame(tick)}
}
$("toggle").onclick=toggle;
let resetArm=0;
function resetDisarm(){clearTimeout(resetArm);resetArm=0;$("reset").textContent="↺";$("reset").classList.remove("arm")}
$("reset").onclick=()=>{
  if(rando&&(mode==="run"||mode==="pause")&&!resetArm){
    $("reset").textContent="¿SEGURO?";$("reset").classList.add("arm");
    resetArm=setTimeout(resetDisarm,3000);return;
  }
  resetDisarm();resetIdle();
};
$("skip").onclick=()=>{if(mode==="run"||mode==="pause"){const was=mode;mode="run";next();if(mode==="run"&&was==="pause"){mode="pause";cancelAnimationFrame(raf);paint()}else if(mode==="run")raf=requestAnimationFrame(tick)}};
/* pantalla completa (con alternativa para iPhone/iPad) */
const root=document.documentElement;
const realFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsOn=()=>realFs()||document.body.classList.contains("pfs");
function fsPaint(){$("fs").textContent=fsOn()?"✕":"⛶";$("fs").title=fsOn()?"Salir de pantalla completa":"Pantalla completa"}
$("fs").onclick=async()=>{
  try{
    if(realFs()){await(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else if(document.body.classList.contains("pfs")){document.body.classList.remove("pfs")}
    else if(root.requestFullscreen){await root.requestFullscreen()}
    else if(root.webkitRequestFullscreen){root.webkitRequestFullscreen()}
    else{document.body.classList.add("pfs")}
  }catch(e){document.body.classList.add("pfs")}
  fsPaint();
};
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,fsPaint));
fsPaint();
document.addEventListener("keydown",e=>{if(e.target.matches&&e.target.matches("input")){if(e.key==="Enter")e.target.blur();else if(e.key==="Escape"){renderCfg();e.target.blur()}return}if(e.code==="Space"||e.key==="Enter"){e.preventDefault();toggle()}if(e.key==="Escape"&&!(rando&&mode!=="idle"))resetIdle()});
renderCfg();paint();
</script>
